# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3f92ccfea8355429db814b3c3a8839a5"
name = "Gold Price Editor"
handle = "gold-price-editor-8"
application_url = "https://gold-price-app-8ngb.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory privacy (GDPR) webhooks, required for the Shopify App Store.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://gold-price-app-8ngb.onrender.com/auth/callback",
  "https://gold-price-app-8ngb.onrender.com/auth/shopify/callback",
  "https://gold-price-app-8ngb.onrender.com/api/auth/callback"
]

[pos]
embedded = false
